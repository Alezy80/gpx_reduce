[project]
name = "gpx_reduce"
version = "1.8.4"
description = "Removes points from gpx-files to reduce filesize and tries to keep introduced distortions to the track at a minimum."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "iso8601",
    "lxml",
    "matplotlib",
    "numpy",
]
